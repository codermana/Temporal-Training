# IRSA ServiceAccount — the production answer to the LocalStack dummy creds
# ("test"/"test") used all morning. No static AWS access keys anywhere.
#
# How IRSA works (IAM Roles for Service Accounts):
#   1. The cluster has an IAM OIDC provider (iam.withOIDC: true in
#      eksctl-cluster.yaml).
#   2. This ServiceAccount is annotated with an IAM role ARN below.
#   3. The IAM role's TRUST POLICY allows the cluster's OIDC provider to assume
#      it, CONDITIONED on the OIDC `sub` claim equal to this exact
#      system:serviceaccount:<namespace>:temporal-worker. That condition is
#      what stops any other pod from assuming the role.
#   4. EKS projects a short-lived web-identity token into every pod that uses
#      this ServiceAccount and sets AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE.
#   5. The AWS SDK in the Activity code picks those up automatically (default
#      credentials provider chain) and calls sts:AssumeRoleWithWebIdentity.
#      Result: temporary, auto-rotated credentials. Nothing baked into the image.
#
# Trust policy attached to role/temporal-worker-irsa (for reference — created
# out-of-band via `eksctl create iamserviceaccount` or `aws iam` / Terraform):
#
#   {
#     "Version": "2012-10-17",
#     "Statement": [{
#       "Effect": "Allow",
#       "Principal": { "Federated":
#         "arn:aws:iam::111122223333:oidc-provider/oidc.eks.us-east-1.amazonaws.com/id/EXAMPLED539D4633E53DE1B716D3041E" },
#       "Action": "sts:AssumeRoleWithWebIdentity",
#       "Condition": { "StringEquals": {
#         "oidc.eks.us-east-1.amazonaws.com/id/EXAMPLED539D4633E53DE1B716D3041E:sub":
#           "system:serviceaccount:default:temporal-worker",
#         "oidc.eks.us-east-1.amazonaws.com/id/EXAMPLED539D4633E53DE1B716D3041E:aud":
#           "sts.amazonaws.com"
#       }}
#     }]
#   }
#
# Permissions policy attached to the same role — the least-privilege set the
# Worker's Activities actually need (Labs 6.1-6.3 wrote these calls):
#   - s3:GetObject, s3:PutObject, s3:ListBucket   (S3 checkpointing / import I/O)
#   - glue:StartJobRun, glue:GetJobRun            (the Glue Activity)
#   - sns:Publish                                 (the notify step)
#   - ssm:GetParameter, ssm:GetParameters         (config/secrets, GetParameter*)
# Scope each to the specific bucket / job / topic / parameter-path ARNs in prod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-worker
  namespace: default
  annotations:
    # Replace 111122223333 with your AWS account id. This is the ONE line that
    # turns a plain ServiceAccount into an IRSA-backed identity.
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/temporal-worker-irsa

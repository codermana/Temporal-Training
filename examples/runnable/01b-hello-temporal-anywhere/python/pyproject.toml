[project]
name = "temporal-lab-hello-temporal-anywhere"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.7,<2",
]

# These labs are runnable scripts, not installable packages — uv just manages the
# environment. Run with:  uv run worker.py   (or main.py, or: uv run pytest)
[tool.uv]
package = false

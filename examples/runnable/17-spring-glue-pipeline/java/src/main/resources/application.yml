# Everything Temporal needs lives here — no @Configuration class for the client
# or Worker. The starter reads this block, connects the client, scans the package
# for @WorkflowImpl / @ActivityImpl, and starts a Worker for the task queue they
# declare. (The AWS clients DO need a small @Configuration — AwsClientConfig —
# because they are plain SDK objects, not something the Temporal starter knows
# about.)
spring:
  application:
    name: spring-glue-pipeline
  temporal:
    connection:
      target: 127.0.0.1:7233   # local dev server; "local" is also accepted
    namespace: default
    workers-auto-discovery:
      packages:
        - training.temporal.glue

# The AWS side of the diagram. All four services live in one LocalStack
# container on :4566 (S3 + SQS + SNS are Community; Glue is Pro-only and faked).
# Override any of these with env vars (AWS_ENDPOINT, AWS_BUCKET, ...) or point
# at real AWS by clearing `endpoint` so the SDK uses the default resolver + the
# task role / IRSA for credentials.
aws:
  endpoint: http://127.0.0.1:4566   # LocalStack; clear to use real AWS
  region: us-east-1
  bucket: lake                      # the S3 "data lake" producer A writes to
  raw-prefix: raw/orders/           # where A lands Parquet partitions
  curated-prefix: curated/orders/   # where the Glue job writes the stitched output
  glue-job-name: stitch-orders      # the (faked) Glue Spark job the Workflow supervises
  trigger-queue-url: http://127.0.0.1:4566/000000000000/glue-triggers   # the bus A drops events on
  notify-topic-arn: arn:aws:sns:us-east-1:000000000000:lake-validated   # SNS topic that notifies A back
  bridge:
    enabled: true                   # set false to run REST-only (no SQS poller)

server:
  port: 8080

logging:
  level:
    io.temporal: INFO
    training.temporal.glue: INFO
    software.amazon.awssdk: WARN

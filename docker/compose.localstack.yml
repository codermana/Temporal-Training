name: temporal-training-localstack

services:
  localstack:
    image: localstack/localstack:3.5
    container_name: temporal-training-localstack
    ports:
      - "4566:4566"
    environment:
      # s3/sqs/sns/ssm/kms/glue are all in the LocalStack Community image.
      # Day-6 morning labs: s3 (blobs), sqs (event trigger, lab 6), sns
      # (fan-out notify, lab 7), ssm+kms (Parameter Store + SecureString, lab 8),
      # glue (supervised compute, lab 1). ECS/EKS/RDS/Route53 are Pro-only and
      # are covered as conceptual labs (8–12) instead.
      SERVICES: "s3,sqs,sns,ssm,kms,glue,iam,sts,logs"
      DEFAULT_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      LS_LOG: "warn"
      DISABLE_EVENTS: "1"
      PERSISTENCE: "1"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  localstack-data:
